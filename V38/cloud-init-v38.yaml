#cloud-config
package_update: true
packages:
  - python3
  - python3-pip
  - python3-venv
  - nginx

runcmd:
  - mkdir -p /home/azureuser/app
  - |
    cat << 'EOF' > /home/azureuser/app/app.py
    import os
    import datetime
    from flask import Flask, request
    from azure.identity import DefaultAzureCredential
    from azure.storage.blob import BlobServiceClient

    app = Flask(__name__)

    STORAGE_ACCOUNT_NAME = "stnovatrixv38albin"
    CONTAINER_NAME = "tickets"
    ACCOUNT_URL = f"https://{STORAGE_ACCOUNT_NAME}.blob.core.windows.net"

    credential = DefaultAzureCredential()
    blob_service_client = BlobServiceClient(account_url=ACCOUNT_URL, credential=credential)

    @app.route('/', methods=['GET', 'POST'])
    def index():
        if request.method == 'POST':
            title = request.form.get('title', 'Inget amne')
            content = request.form.get('content', '')
            file = request.files.get('file')
            timestamp = datetime.datetime.now().strftime("%Y%m%d-%H%M%S")
            
            ticket_blob_name = f"ticket-{timestamp}.txt"
            ticket_client = blob_service_client.get_blob_client(container=CONTAINER_NAME, blob=ticket_blob_name)
            ticket_data = f"Titel: {title}\nDatum: {timestamp}\n\nBeskrivning:\n{content}"
            ticket_client.upload_blob(ticket_data, overwrite=True)

            if file and file.filename != '':
                file_blob_name = f"attachment-{timestamp}-{file.filename}"
                file_client = blob_service_client.get_blob_client(container=CONTAINER_NAME, blob=file_blob_name)
                file_client.upload_blob(file.read(), overwrite=True)

            return "<h2>Arendet och bilagan har sparats i Azure Blob Storage!</h2><a href='/'>Skicka ett till</a>"

        return '''
        <h2>Novatrix Arendeformular</h2>
        <form method="POST" enctype="multipart/form-data">
            <p><label>Titel:</label><br><input type="text" name="title" required></p>
            <p><label>Beskrivning:</label><br><textarea name="content" rows="4" required></textarea></p>
            <p><label>Bifoga fil (bilaga):</label><br><input type="file" name="file"></p>
            <p><button type="submit">Skicka arende</button></p>
        </form>
        '''

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=5000)
    EOF
  - |
    cat << 'EOF' > /etc/systemd/system/novatrix.service
    [Unit]
    Description=Novatrix Flask App
    After=network.target

    [Service]
    User=azureuser
    WorkingDirectory=/home/azureuser/app
    ExecStart=/home/azureuser/app/venv/bin/python3 /home/azureuser/app/app.py
    Restart=always

    [Install]
    WantedBy=multi-user.target
    EOF
  - |
    cat << 'EOF' > /etc/nginx/sites-available/default
    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    EOF
  - chown -R azureuser:azureuser /home/azureuser/app
  - python3 -m venv /home/azureuser/app/venv
  - /home/azureuser/app/venv/bin/pip install flask azure-storage-blob azure-identity
  - systemctl daemon-reload
  - systemctl enable novatrix
  - systemctl start novatrix
  - systemctl restart nginx